services:
  mongodb:
    image: mongo:latest
    container_name: work-mgmt-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - work-network

  backend:
    build:
      context: ./backend
    container_name: work-mgmt-backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "9999:9999"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - work-network
    # ========================================
    # Watch for file changes in backend
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          # ignore built artifacts (nên ignore node_modules)
          ignore:
            - node_modules/
        - action: rebuild
          # rebuild nếu package.json/backend config thay đổi
          path: ./backend/package.json

  frontend:
    build:
      context: ./frontend
    container_name: work-mgmt-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    stdin_open: true
    depends_on:
      - backend
    networks:
      - work-network
    # ========================================
    # Watch for file changes in frontend
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          # nếu thay đổi config như package.json
          path: ./frontend/package.json

networks:
  work-network:
    driver: bridge

volumes:
  mongo-data:
